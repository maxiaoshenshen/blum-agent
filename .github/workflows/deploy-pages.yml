name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export with basePath)
        env:
          NEXT_PUBLIC_BASE_PATH: /blum-agent
        run: next build

      - name: Inject basePath for GitHub Pages subdirectory
        run: |
          # Process ALL HTML files — root and nested (_next/static/server/...)
          find out -name "*.html" | xargs sed -i \
            -e 's|href="/_next/|href="/blum-agent/_next/|g' \
            -e 's|src="/_next/|src="/blum-agent/_next/|g' \
            -e 's|href=\\"/_next/|href=\\"/blum-agent/_next/|g' \
            -e 's|src=\\"/_next/|src=\\"/blum-agent/_next/|g'
          echo "BasePath injection complete"
          echo "Files modified: $(grep -rl 'blum-agent' out --include='*.html' | wc -l | tr -d ' ')"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
