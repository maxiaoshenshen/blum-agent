name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug build output structure
        run: |
          echo "=== Checking key files ==="
          if [ -f "out/server/app/index.html" ]; then echo "FOUND: out/server/app/index.html"; else echo "MISSING: out/server/app/index.html"; fi
          if [ -f "out/index.html" ]; then echo "FOUND: out/index.html"; else echo "MISSING: out/index.html"; fi
          if [ -d "out/server" ]; then echo "FOUND: out/server/"; else echo "MISSING: out/server/"; fi
          if [ -d "out/build" ]; then echo "FOUND: out/build/"; else echo "MISSING: out/build/"; fi
          echo "=== Files in out/ ==="
          find out -type f 2>/dev/null | head -20 || echo "out/ not found or empty"

      - name: Fix static export directory structure
        run: |
          echo "Step 1: Ensure out directory exists"
          mkdir -p out
          echo "Step 2: Copy HTML files"
          if [ -f "out/server/app/index.html" ]; then
            echo "Using vinext prerendered HTML"
            cp out/server/app/index.html out/index.html
            cp out/server/app/_not-found.html out/_not-found.html 2>/dev/null || true
            cp out/server/app/_global-error.html out/_global-error.html 2>/dev/null || true
          else
            if [ -f "out/index.html" ]; then
              echo "index.html already at root"
            else
              echo "Creating minimal index.html"
              printf '%s\n' '<!DOCTYPE html>' '<html lang="zh-CN">' '<head>' '<meta charset="utf-8"/>' '<meta name="viewport" content="width=device-width, initial-scale=1"/>' '<title>Blum Agent</title>' '</head>' '<body>' '<div id="root"></div>' '</body>' '</html>' > out/index.html
            fi
          fi
          echo "Step 3: Copy static assets from dist/client"
          cp dist/client/favicon.svg out/ 2>/dev/null || true
          cp dist/client/og.png out/ 2>/dev/null || true
          cp dist/client/manifest.json out/ 2>/dev/null || true
          cp dist/client/robots.txt out/ 2>/dev/null || true
          cp dist/client/sitemap.xml out/ 2>/dev/null || true
          cp dist/client/_headers out/ 2>/dev/null || true
          cp dist/client/sw.js out/ 2>/dev/null || true
          echo "Step 4: Setup _next/static directory structure"
          mkdir -p out/_next/static/chunks out/_next/static/media
          if [ -d "out/static/chunks" ]; then cp -r out/static/chunks/* out/_next/static/chunks/ 2>/dev/null || true; fi
          if [ -d "out/static/media" ]; then cp -r out/static/media/* out/_next/static/media/ 2>/dev/null || true; fi
          if [ -d "out/build" ]; then cp -r out/build out/_next/static/ 2>/dev/null || true; fi
          if [ -d "out/server" ]; then cp -r out/server out/_next/static/ 2>/dev/null || true; fi
          echo "Step 5: Final verification"
          if [ -f "out/index.html" ]; then echo "OK: index.html present"; else echo "FAIL: index.html MISSING"; fi
          echo "Total files: $(find out -type f 2>/dev/null | wc -l)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
