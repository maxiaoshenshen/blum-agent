name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (vinext static export)
        run: npm run build

      - name: Inject basePath for GitHub Pages subdirectory
        run: |
          python3 << 'PYTHON'
          import os, glob
          base_path = '/blum-agent'
          total_replaced = 0
          for path in glob.glob('out/**/*.html', recursive=True):
              with open(path) as f:
                  content = f.read()
              before = content.count('/_next/')
              content = content.replace('/_next/', f'{base_path}/_next/')
              with open(path, 'w') as f:
                  f.write(content)
              replaced = content.count(f'{base_path}/_next/')
              total_replaced += replaced
              print(f'  {path}: {before} -> {replaced}')
          print(f'Total: {total_replaced} occurrences across all HTML files')
          PYTHON

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
